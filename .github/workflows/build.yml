name: Build Nexus Link

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name nexus_link .

          GRADLE_FILE=""
          if [ -f android/app/build.gradle ]; then
            GRADLE_FILE="android/app/build.gradle"
          elif [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi

          if [ -n "$GRADLE_FILE" ]; then
            sed -i \
              -e 's/flutter\.minSdkVersion/21/g' \
              -e 's/minSdk = flutter\.minSdkVersion/minSdk = 21/g' \
              "$GRADLE_FILE"
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-link-release
          path: build/app/outputs/flutter-apk/app-release.apk
