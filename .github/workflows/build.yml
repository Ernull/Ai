name: Build Nexus Link

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Project & Fix Android Settings
        shell: bash
        run: |
          set -euo pipefail
          
          # ۱. ساخت پوشه‌ها و فایل‌های اندروید
          flutter create --platforms=android --project-name nexus_link .

          # ۲. حذف پوشه تست پیش‌فرض (برای جلوگیری از ارور)
          rm -rf test

          # ۳. ارتقای SDK اندروید برای پشتیبانی از وب‌ویو
          GRADLE_FILE=""
          if [ -f android/app/build.gradle ]; then
            GRADLE_FILE="android/app/build.gradle"
          elif [ -f android/app/build.gradle.kts ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          fi

          if [ -n "$GRADLE_FILE" ]; then
            sed -i \
              -e 's/flutter\.minSdkVersion/21/g' \
              -e 's/minSdk = flutter\.minSdkVersion/minSdk = 21/g' \
              "$GRADLE_FILE"
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

          # ۴. تزریق مجوز اینترنت
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest[^>]*>/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          
          # ۵. رفع باگ Proguard
          find /opt/hostedtoolcache ~/.pub-cache -type f -name "build.gradle" 2>/dev/null -exec sed -i 's/proguard-android.txt/proguard-android-optimize.txt/g' {} + || true

      - name: Install dependencies & Generate Icon
        run: |
          # ۶. دانلود پکیج‌ها و تبدیل اتوماتیک عکس icon.png به آیکون برنامه 🪄
          flutter pub get
          if [ -f "icon.png" ]; then flutter pub run flutter_launcher_icons; fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-link-release
          path: build/app/outputs/flutter-apk/app-release.apk
